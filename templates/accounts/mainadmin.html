{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Administration | FranchiseHub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/mainadmin.css' %}">
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans antialiased text-gray-800">

    <nav class="admin-navbar">
        <div class="nav-container">
            <a href="{% url 'admin_index' %}" class="nav-brand">
                <div class="brand-icon">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <span class="brand-text">System Admin</span>
            </a>

            <div class="hamburger" id="hamburger">
                <svg width="30" height="30" fill="currentColor" viewBox="0 0 20 20" style="color: white;">
                    <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                </svg>
            </div>

            <div class="nav-menu" id="nav-menu">
                
                <a href="{% url 'admin_index' %}" class="nav-link active">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                    Admin
                </a>

                <a href="{% url 'admin_dashboard' %}" class="nav-link">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    OVERVIEW
                </a>

                <a href="{% url 'admin_password_change' %}" class="nav-link">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
                    Change Password
                </a>

                <a href="{% url 'logout' %}" class="nav-link logout">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
                    Log Out
                </a>
            </div>
        </div>
    </nav>
    <div class="bg-gray-50 border-b border-gray-200 px-8 py-3 text-xs font-medium text-gray-500">
        <div class="max-w-7xl mx-auto">
            Home <span class="mx-2">&rsaquo;</span> <span class="text-orange-600">Site administration</span>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        
        <h1 class="text-2xl font-bold text-gray-800 mb-8 font-[Poppins]">Site administration</h1>

        <div class="w-full">
            
            <div class="border border-gray-200 rounded-lg shadow-sm mb-6 overflow-hidden bg-white">
                <div class="django-module-header px-6 py-3 text-white font-semibold text-sm uppercase tracking-wide">
                    Authentication and Authorization
                </div>

                <div class="bg-white">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 last:border-0 hover:bg-orange-50 transition-colors">
                        <div class="flex-grow">
                            <a href="{% url 'admin_user_list' %}" class="django-link font-bold text-base text-orange-700 hover:text-orange-900">Users</a>
                        </div>

                        <div class="flex items-center space-x-6 text-xs font-bold text-gray-400 uppercase">
                            <a href="{% url 'admin_add_user' %}" class="group flex items-center hover:text-gray-600 transition-colors">
                                <svg class="w-4 h-4 mr-1 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
                                </svg>
                                <span class="text-gray-500 group-hover:text-gray-800">Add</span>
                            </a>

                            <a href="{% url 'admin_user_list' %}" class="group flex items-center hover:text-gray-600 transition-colors">
                                <svg class="w-4 h-4 mr-1 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                                </svg>
                                <span class="text-gray-500 group-hover:text-gray-800">Change</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        // --- HAMBURGER MENU TOGGLE ---
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        if(hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
