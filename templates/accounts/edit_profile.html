{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'accounts/profile.css' %}">
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="logo"><span>Franchise</span>Hub</a>
        <div class="nav-links">
            <a href="{% url 'browse' %}">Browse Franchises</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="get-started">Get Started</a>
        </div>
    </nav>

    <!-- ===== PROFILE FORM ===== -->
    <div class="profile-container">
        <h2>Edit Profile</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="button-group">
                <button type="submit">Save Changes</button>
                <a href="{% url 'home' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
