{% extends 'accounts/base_franchisor.html' %}

{% block title %}Edit Franchise | FranchiseHub{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Edit Franchise: {{ franchise.name }}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update Franchise</button>
    </form>
</div>
{% endblock %}
