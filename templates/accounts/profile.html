{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | FranchiseHub</title>
  <link rel="stylesheet" href="{% static 'accounts/profile.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
      <div class="nav-left">
          <img src="{% static 'accounts/logo.png' %}" alt="Logo" class="logo">
          <h2><span>Franchise</span>Hub</h2>
      </div>
      <div class="nav-right">
          <a href="{% url 'browse' %}">Browse Franchises</a>
          {% if user.is_authenticated %}
              <a href="{% url 'logout' %}">Logout</a>
          {% else %}
              <a href="{% url 'login' %}">Login</a>
          {% endif %}
          <a href="{% url 'register' %}" class="btn">Get Started</a>
      </div>
  </nav>

  <!-- ===== HEADER ===== -->
  <section class="profile-header" style="background-color: #d35400; color: white; text-align: center; padding: 40px 0;">
      <h1>My Profile</h1>
      <p>Manage your account information</p>
  </section>

  <!-- ===== PROFILE FORM ===== -->
  <div class="profile-container">
      <form method="POST" action="{% url 'profile' %}">
          {% csrf_token %}
          <h2>Personal Information</h2>

          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" value="{{ user.full_name }}">

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" value="{{ user.email }}">

          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" placeholder="Enter your phone number" value="{{ user.phone }}">

          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="Enter your location" value="{{ user.location }}">

          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" rows="4" placeholder="Write a short bio...">{{ user.bio }}</textarea>

          <div class="form-buttons">
              <a href="{% url 'browse' %}" class="cancel-btn">Cancel</a>
              <button type="submit" class="save-btn">Save Changes</button>
          </div>
      </form>
  </div>
</body>
</html>
