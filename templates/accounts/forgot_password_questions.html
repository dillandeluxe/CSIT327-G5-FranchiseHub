{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Questions | FranchiseHub</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navbar (from home.html) -->
  <nav class="navbar">
    <a href="{% url 'home' %}" class="logo"><span>Franchise</span>Hub</a>
    <div class="nav-links">
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}" class="get-started">Get Started</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="auth-background">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Security Questions</h1>
          <p class="auth-subtitle">Answer the questions you set during registration</p>
        </div>

        {% if messages %}
          <div class="messages-wrapper">
            {% for message in messages %}
              <div class="message-alert message-{{ message.tags }}">
                <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="POST" class="auth-form" id="securityForm">
          {% csrf_token %}
          
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-question-circle"></i>
              {{ question_1 }}
            </label>
            <input type="text" name="answer_1" class="form-input" placeholder="Your answer" required autocomplete="off" autofocus>
            <span class="form-error" data-field="answer_1"></span>
          </div>

          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-question-circle"></i>
              {{ question_2 }}
            </label>
            <input type="text" name="answer_2" class="form-input" placeholder="Your answer" required autocomplete="off">
            <span class="form-error" data-field="answer_2"></span>
          </div>

          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-question-circle"></i>
              {{ question_3 }}
            </label>
            <input type="text" name="answer_3" class="form-input" placeholder="Your answer" required autocomplete="off">
            <span class="form-error" data-field="answer_3"></span>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Verify Answers</span>
            <span class="btn-loader" style="display:none;">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
          </button>
        </form>

        <div class="auth-footer">
          <p><a href="{% url 'login' %}" class="auth-link"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'accounts/modern_auth.js' %}"></script>
</body>
</html>
