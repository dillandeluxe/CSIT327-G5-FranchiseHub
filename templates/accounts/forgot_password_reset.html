{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | FranchiseHub</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navbar (from home.html) -->
  <nav class="navbar">
    <a href="{% url 'home' %}" class="logo"><span>Franchise</span>Hub</a>
    <div class="nav-links">
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}" class="get-started">Get Started</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="auth-background">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Set New Password</h1>
          <p class="auth-subtitle">Create a strong password for your account</p>
        </div>

        {% if messages %}
          <div class="messages-wrapper">
            {% for message in messages %}
              <div class="message-alert message-{{ message.tags }}">
                <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="POST" class="auth-form" id="resetForm">
          {% csrf_token %}
          
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-lock"></i>
              New Password
            </label>
            <div class="password-wrapper">
              <input type="password" name="new_password" id="new_password" class="form-input" placeholder="Enter new password" required autocomplete="new-password" autofocus>
              <button type="button" class="password-toggle" onclick="togglePassword('new_password')">
                <i class="fas fa-eye" id="new_password-icon"></i>
              </button>
            </div>
            <div class="password-strength" id="passwordStrength">
              <div class="strength-bar">
                <div class="strength-bar-fill" id="strengthBar"></div>
              </div>
              <span class="strength-text" id="strengthText">Password strength</span>
            </div>
            <span class="form-error" data-field="new_password"></span>
          </div>

          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-lock"></i>
              Confirm New Password
            </label>
            <div class="password-wrapper">
              <input type="password" name="confirm_password" id="confirm_password" class="form-input" placeholder="Confirm new password" required autocomplete="new-password">
              <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
                <i class="fas fa-eye" id="confirm_password-icon"></i>
              </button>
            </div>
            <span class="form-error" data-field="confirm_password"></span>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Reset Password</span>
            <span class="btn-loader" style="display:none;">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
          </button>
        </form>

        <div class="auth-footer">
          <p><a href="{% url 'login' %}" class="auth-link"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'accounts/modern_auth.js' %}"></script>
  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById(fieldId + '-icon');
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Password strength checker
    const passwordInput = document.getElementById('new_password');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    if (passwordInput) {
      passwordInput.addEventListener('input', function() {
        const password = this.value;
        let strength = 0;

        if (password.length >= 8) strength += 25;
        if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 25;
        if (password.match(/\d/)) strength += 25;
        if (password.match(/[^a-zA-Z\d]/)) strength += 25;

        strengthBar.style.width = strength + '%';

        if (strength <= 25) {
          strengthBar.style.background = '#ef4444';
          strengthText.textContent = 'Weak password';
          strengthText.style.color = '#ef4444';
        } else if (strength <= 50) {
          strengthBar.style.background = '#f59e0b';
          strengthText.textContent = 'Fair password';
          strengthText.style.color = '#f59e0b';
        } else if (strength <= 75) {
          strengthBar.style.background = '#3b82f6';
          strengthText.textContent = 'Good password';
          strengthText.style.color = '#3b82f6';
        } else {
          strengthBar.style.background = '#10b981';
          strengthText.textContent = 'Strong password';
          strengthText.style.color = '#10b981';
        }
      });
    }
  </script>
</body>
</html>
