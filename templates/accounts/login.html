{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FranchiseHub</title>
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="{% url 'home' %}">
                <h2>Franchise<span>Hub</span></h2>
            </a>
        </div>
        <div class="nav-right">
            <a href="{% url 'browse' %}">Browse Franchises</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="btn">Get Started</a>
        </div>
    </nav>

    <div class="background">
        <div class="login-container">
            <div class="login-card">
                
                <h2>Welcome Back</h2>
                <p>Sign in to your FranchiseHub account</p>

                <form method="POST" action="">
                    {% csrf_token %}
                    
                    {% if messages %}
                        <ul class="messages">
                            {% for message in messages %}
                                <li class="{{ message.tags }}">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}

                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username" required>

                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>

                    <button type="submit" class="btn-apply">Login</button>
                </form>

                <p class="register-text">
                    Don’t have an account? <a href="{% url 'register' %}">Create one</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
