{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FranchiseHub</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navbar (from home.html) -->
  <nav class="navbar">
    <a href="{% url 'home' %}" class="logo"><span>Franchise</span>Hub</a>
    <div class="nav-links">
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}" class="get-started">Get Started</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="auth-background">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to your FranchiseHub account</p>
        </div>

        {% if messages %}
          <div class="messages-wrapper">
            {% for message in messages %}
              <div class="message-alert message-{{ message.tags }}">
                <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="POST" class="auth-form" id="loginForm" novalidate>
          {% csrf_token %}
          
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-user"></i>
              Username
            </label>
            <input type="text" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username" autofocus>
            <span class="form-error" data-field="username"></span>
          </div>

          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-lock"></i>
              Password
            </label>
            <div class="password-wrapper">
              <input type="password" name="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" onclick="togglePassword('password')">
                <i class="fas fa-eye" id="password-icon"></i>
              </button>
            </div>
            <span class="form-error" data-field="password"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember_me">
              <span class="checkbox-custom"></span>
              <span class="checkbox-text">Remember me</span>
            </label>
            <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" style="display:none;">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
          </button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="{% url 'register' %}" class="auth-link">Create one</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'accounts/modern_auth.js' %}"></script>
  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById(fieldId + '-icon');
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
